name: Update GeoHide Hosts

on:
  schedule:
    - cron: '30 6 * * *'   # daily at 06:30 UTC (offset from the hourly blocklist job)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hosts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run hosts update script
        run: |
          chmod +x update_hosts.sh
          ./update_hosts.sh

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: GeoHide hosts"
          file_pattern: 'rules/hosts_rules.txt'
          branch: ${{ github.ref }}
